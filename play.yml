        - password_SSH
        - Get local public key

    - name: Insert public key to authorized_keys
      blockinfile:
        path: /home/postgres/.ssh/authorized_keys
        block: |

          {{ public_key['content'] | b64decode }}

        marker: ""
        insertbefore: EOF

      tags:
        - password_SSH
        - Insert public key to authorized_keys
