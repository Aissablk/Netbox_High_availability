- name: Copy public key to primary and standby
  hosts:  standby_nodes
  remote_user: "{{user}}"
  tasks:

    - name: Get local public key
      slurp:
        path: ~/id_rsa.pub
      register: public_key
      delegate_to: localhost
      run_once: true
      tags:
        - password_SSH
        - get_local_key
    - name: Insert public key to authorized_keys
      blockinfile:
        path: "~/.ssh/authorized_keys"
        block: |

          {{ public_key['content'] | b64decode }}

        marker: ""
        insertbefore: EOF

      tags:
        - password_SSH
        - Insert public key to authorized_keys
#"{{user}}" to postgres

- name: Copy public key to primary and standby
  hosts:  primary_nodes, standby_nodes
  remote_user: postgres
  tasks:
    - name: Get local public key
      slurp:
        path: ~/id_rsa.pub
      register: public_key
      delegate_to: localhost
      run_once: true 
