# Configure the stand by node
- name: Postgresql StandBy nodes configuration
  hosts: standby_nodes
  remote_user: postgres
  gather_facts: false
  tasks:
    # - name: Check if standby data directory exists
    #   stat:
    #     path: "/pgsql/{{ replication_directory }}"
    #   register: standby_data_dir
    #   tags:
    #     - configure_standby_nodes

    - name: Initialise replication with primary node
      tags:
        - configure_standby_nodes
        - initialise_replication22
      ansible.builtin.shell:
        pg_basebackup
        -D /pgsql/{{ replication_directory }}
        -h {{postgresql_primary_host}}
        -p {{ postgresql_port }}
        -U {{ postgresql_user }} -w
        -S {{ slot_name }} -C -R



    # - name: Get standby PostgreSQL status
    #   become: true
    #   become_user: postgres
    #   ansible.builtin.shell:
    #     /usr/lib/postgresql/{{postgresql_version}}/bin/pg_ctl status -D /pgsql/{{ replication_directory }}
    #   register: standby_pg_status
    #   ignore_errors: true

    - name: Restart Postgresql Server on the created replica
      tags:
        - configure_standby_nodes
        - initialise_cluster44
      ansible.builtin.shell:
        pg_ctl -D /pgsql/{{ replication_directory }} start



- name: pgpool installation
  hosts: pgpool1
