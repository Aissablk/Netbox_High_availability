        update_cache: yes

    - name: Install compilation tools
      yum:
        name:
          - '@development'
          - gcc
          - gcc-c++
          - make
        state: present
      tags:
        - install compilation tools
        - install_pgpool


    - name: Install libpq-dev
      yum:
        name: postgresql-devel
        state: present
      tags:
        - install libpq-dev 

