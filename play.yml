- name: Prepare necessary packages and folders
  hosts: standby_nodes, primary_nodes
  gather_facts: false
  become: yes
  remote_user: "{{user}}"
  tasks:

    - name: Install PostgreSQL 15 Server
      become: true
      command: dnf module -y install postgresql:15/server
      tags: install_postgresql
    - name: Delete postgres user
      user:
        name: postgres 
        state: absent
      tags: delete_user_postgres
    - name: create user
      become: yes
      ansible.builtin.user: 
        name: postgres
        state: present 
      tags: create_user
    - name: create .ssh
      become: true
      ansible.builtin.file:
        path: /home/postgres/.ssh
        state: directory
        owner: postgres
        mode : "700"
      tags: ssh_key
    - name: copy ssh key
      become: true
      ansible.builtin.copy:
        src: ~/.ssh/id_rsa.pub
        dest: /home/postgres/.ssh/authorized_keys
        owner: postgres
        mode: "600"
      tags: ssh_key
    - name: Change ownership of /var/run/postgresql/
      become: true
      file:
        path: /var/run/postgresql/
        owner: postgres
        group: postgres
        recurse: yes
      tags: change_owner
    - name: Create Directory for replication
      tags:
        - prepare_replication_environment
        - create_backup_directory
      become: true
      ansible.builtin.file:
        path: /pgsql
        state: directory
        owner: postgres
        group: postgres
- name: Create Postgresql Cluster
  hosts: primary_nodes
  gather_facts: false
  remote_user: postgres

  tasks:
    - name: Initialise Postgresql Cluster
      tags:
        - configure_primary_nodes
        - initialise_cluster
        - init_db_primary_node 
      ansible.builtin.shell: |
        initdb -D /pgsql/{{ replication_directory }}
    - name: Configure ports and hosts
      tags:
        - configure_primary_nodes
        - configure_hosts_ports
        - initialise_cluster
      ansible.builtin.lineinfile:
        path: "/pgsql/{{ replication_directory }}/postgresql.conf"
        regexp: "^#listen_addresses.*"
        line: "listen_addresses = '*'"
    - name: Configure ports and hosts
      tags:
        - configure_primary_nodes
        - configure_hosts_ports
        - initialise_cluster
      ansible.builtin.lineinfile:
        path: "/pgsql/{{ replication_directory }}/postgresql.conf"
        regexp: "^#port.*"
        line: "port = {{ postgresql_port }}"
    - name: Configure host based connections
      tags:
        - configure_primary_nodes
        - initialise_cluster
        - configure_host_based_connections
      ansible.builtin.lineinfile:
        path: "/pgsql/{{ replication_directory }}/pg_hba.conf"
        line: "{{ host_connections.type }}\t{{ item }}\t{{ host_connections.user }}\t{{ host_connections.address }}\t\t{{ host_connections.method }}"
      loop: "{{ host_connections.databases }}"
    - name: Restart Postgresql Server on the created cluster
      tags:
        - configure_primary_nodes 
        - initialise_cluster
        - restart_postgresql_server
      ansible.builtin.shell:
        pg_ctl -D /pgsql/{{ replication_directory }} start
- name: Postgresql StandBy nodes configuration
  hosts: standby_nodes
  remote_user: postgres
  gather_facts: false
  tasks:

    - name: Initialise replication with primary node
      tags:
        - configure_standby_nodes
        - initialise_replication 
      ansible.builtin.shell:
        pg_basebackup
        -D /pgsql/{{ replication_directory }}
        -h {{postgresql_primary_host}}
        -p {{ postgresql_port }}
        -U {{ postgresql_user }} -w
        -S {{ slot_name }} -C -R
    - name: Restart Postgresql Server on the created replica
      tags:
        - configure_standby_nodes
        - initialise_cluster
      ansible.builtin.shell:
        pg_ctl -D /pgsql/{{ replication_directory }} start
- name: pgpool installation
  hosts: pgpool1
  gather_facts: false
  become: yes
  remote_user: "{{user}}"
  tasks:
    - name: Install wget
      become: true
      ansible.builtin.yum:
        name: wget
        state: present
      tags: 
        - install_pgpool
        - install wget package  
    - name: Download the link
      command: wget https://www.pgpool.net/mediawiki/download.php?f=pgpool-II-4.4.5.tar.gz
      tags:
        - downloads_link
        - install_pgpool
    - name: extract link
      command: sudo tar xf download.php?f=pgpool-II-4.4.5.tar.gz
      tags:
        - extract_link
        - install_pgpool 
    - name: Update the memory cache
      tags:
        - update_memory_cache  
      become: true
      ansible.builtin.yum:
        update_cache: yes
    - name: Install compilation tools
      yum:
        name:
          - '@development'
          - gcc
          - gcc-c++
          - make
        state: present
      tags:
        - install compilation tools
        - install_pgpool
    - name: Install libpq-dev
      yum:
        name: postgresql-devel
        state: present
      tags:
        - install libpq-dev 
    - name: Running sudo ./configure dans pgpool-II-4.4.5/
      command: sudo ./configure
      args:
        chdir: pgpool-II-4.4.5/
      tags:
        - running sudo ./configure dans pgpool-II-4.4.5/
        - install_pgpool
    - name:  Software compilation
      command: sudo make
      args:
        chdir: pgpool-II-4.4.5/
      tags:
        - software compilation
        - install_pgpool
    - name:  Installs the compiled software into the system
      command: sudo make install
      args:
        chdir: pgpool-II-4.4.5/
      tags:
         - installs the compiled software into the system
         - install_pgpool
    - name: Copy pgpool.conf.sample to pgpool.conf
      command: sudo cp pgpool.conf.sample pgpool.conf
      args:
        chdir: /usr/local/etc/
      tags:
         - Copy_file
         - install_pgpool
    - name: Copy pgpool.failover.sh.sample to failover.sh
      command: sudo cp failover.sh.sample failover.sh
      args:
        chdir: /usr/local/etc/
      tags:
        - Copy_file
        - install_pgpool
        
    - name: Copy pool_hba.conf
      command: sudo cp pool_hba.conf.sample pool_hba.conf
      args:
        chdir: /usr/local/etc/
      tags:
        - Copy_file 
        - install_pgpool 
       
    - name: Configure pool_hba.conf
      tags:
        - configure_primary_nodes 
        - configure_host_based_connections 
      ansible.builtin.lineinfile:
        path: "/usr/local/etc/pool_hba.conf"
        line: "{{ host_connections.type }}\t{{ item }}\t{{ host_connections.user }}\t{{ host_connections.address }}\t\t{{ host_connections.method }}"
      loop: "{{ host_connections.databases }}"
    - name: Install PostgreSQL 15 Server
      become: true
      command: dnf module -y install postgresql:15/server
      tags: install_postgresql

    - name: Delete postgres user
      user:
        name: postgres
        state: absent
      tags: 
        - delete_user_postgres
        - install_postgresql
    - name: Create user
      become: yes
      ansible.builtin.user:
        name: postgres
        state: present
      tags: 
        - delete_user_postgres 
        - install_postgresql
    - name: create .ssh
      become: true
      ansible.builtin.file:
        path: /home/postgres/.ssh
        state: directory
        owner: postgres
        group: postgres
        mode : "700" 
      tags: generate_ssh_key
    - name: Genereate ssh key1
      openssh_keypair:
        path: /home/postgres/.ssh/id_rsa
        state: present
        type: rsa
        size: 2048
        owner: postgres
        force: yes
      tags: generate_ssh_key
    - name: Change the owner of the pgpool-II-4.4.5 directory
      ansible.builtin.command: sudo chown -R "{{user}}":"{{user}}" /home/"{{user}}"/pgpool-II-4.4.5/
      tags: chown_pgpool_files
    - name: Change the owner of the main pgpool executable binary
      ansible.builtin.command: sudo chown -R "{{user}}":"{{user}}" /usr/local/bin/pgpool
      tags: chown_pgpool_files
    - name: Change the owner of the pgpool directory of the configuration files
      ansible.builtin.command: sudo chown -R "{{user}}":"{{user}}" /usr/local/etc/
      tags: chown_pgpool_files
    - name: Change the owner of the share directory
      ansible.builtin.command: sudo chown -R "{{user}}":"{{user}}"  /usr/local/share/
      tags: chown_pgpool_files
    - name: Change the owner of postgresql
      ansible.builtin.command: sudo chown -R "{{user}}":"{{user}}" /var/run/postgresql/
      tags: chown_pgpool_files
    - name: giving permissions of the script file
      ansible.builtin.command: chmod a+wx /usr/local/etc/failover.sh
      tags: chmod_pgpool_files
    - name: giving permissions of the pgpool configurations file
      ansible.builtin.command: chmod a+wx /usr/local/etc/pgpool.conf
      tags: chmod_pgpool_files
    - name: giving permissions of pool_hba file
      ansible.builtin.command: chmod a+wx /usr/local/etc/pool_hba.conf
      tags: chmod_pgpool_files
#"pgpool.conf configuration "
    - name: Copy pgpool.conf.j2 template
      become: true
      ansible.builtin.template:
        src: pgpool.conf.j2
        dest: "/usr/local/etc/pgpool.conf"
      tags: copy_pgpool.conf 

#"failover.sh configuration"
    - name: Copy configuration.py template failover.sh
      become: true
      ansible.builtin.template:
        src: failover.sh.j2
        dest: "/usr/local/etc/failover.sh"
      tags: copy_failover_sh 
#setup passwordSSH
    - name: Create .ssh directory for Postgres
