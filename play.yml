- name: running pgool
  hosts: pgpool1
  gather_facts: false
  remote_user: "{{user}}"
  tasks:
    - name: running pgpool
      shell: pgpool -n > /dev/null 2>&1 &
      async: 300
      poll: 0    
      tags:
        - password_SSH89
      register: pgpool_result


    - name: Run SQL script to create role, database, and set permissions
      ansible.builtin.shell: |
        psql -U postgres -p 9999 <<EOF
        CREATE ROLE netbox WITH LOGIN PASSWORD '{{ postgresql_password }}';
        CREATE DATABASE netbox;
        GRANT ALL PRIVILEGES ON DATABASE netbox TO netbox;
        ALTER ROLE netbox WITH SUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS;
        EOF
      tags: run_upgrade_script1



- name: Install, Configure system packages and Database Manageement systems for Netbox
  gather_facts: false
  become: true
  hosts: netbox 
  tasks:
    - name: downloads the required packages 
      yum:
        name: "{{ item }}"
        state: present
      loop:
        - gcc
        - libxml2-devel
        - libxslt-devel
        - libffi-devel
        - libpq-devel
        - openssl-devel 
        - redhat-rpm-config
        - python38
        - python38-pip
        - python3-virtualenv
        - python38-devel

    - name: Downloads repo Postgresql
      dnf:
        name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-8-x86_64/pgdg-redhat-repo-latest.noarch.rpm
        state: present
        disable_gpg_check: yes

    - name: Disable the PostgreSQL module
      ansible.builtin.command:
        cmd: dnf -qy module disable postgresql
      become: yes

    - name: downloads PostgreSQL
      dnf:
        name: postgresql13-server
        state: present

    - name: init postgresql
      command: sudo postgresql-13-setup initdb
      tags: check_it


    - name: Copy pg_hba template
      tags:
        - copy_pghba

      become: true
      ansible.builtin.template: 
        src: pg_hba.conf.j2
        dest: "/var/lib/pgsql/13/data/pg_hba.conf"


    - name: activate PostgreSQL-13 service
      systemd:
        name: postgresql-13
        enabled: yes
        masked: no
      tags: runn_psql

    - name: update system
      command: sudo yum update -y --nobest
      tags: ypdate




    - name: activate and run Postgresql service 
      systemd:
        name: postgresql-13
        state: started
        enabled: yes
      tags: runn_psqlaissa

    - name: Create Postgres Database for Netbox
      tags:
        - runn_psqlaissa
      ansible.builtin.shell: |
        sudo -u postgres psql << EOF
        CREATE DATABASE {{ postgres_db }};
        CREATE USER {{ postgres_user }} WITH PASSWORD '{{ postgresql_password }}';
        ALTER DATABASE {{  postgres_db }} OWNER TO {{ postgres_user }};
        ALTER ROLE netbox WITH SUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS;
        \connect {{ postgres_db }};
        GRANT CREATE ON SCHEMA public TO {{ postgres_user }};
        EOF


    - name: Install Redis
      tags:
        - runn_psqlaissa
        - create_netbox_database
      become: true
      ansible.builtin.yum:
        name: redis
        state: latest

    - name: Restart Redis Server
      tags:
        - install_redis
        - runn_psqlaissa
        - create_netbox_database
      become: true
      ansible.builtin.service:
        name: redis
        state: restarted
        enabled: true

    - name: Download the Netbox Archive
      tags:
        - download_netbox
        - runn_psqlaissa
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/netbox-community/netbox/archive/refs/tags/v{{ netbox_version }}.tar.gz"
        dest: "/opt/v{{ netbox_version }}.tar.gz"

    - name: Extract Netbox archive
      tags:
        - extract_netbox_archive
        - download_netbox
        - runn_psqlaissa
      become: true
      ansible.builtin.unarchive:
        src: "/opt/v{{ netbox_version }}.tar.gz"
        dest: /opt
        remote_src: true
    - name: Create symbolic link
      tags:
        - create_symbolic_link
        - download_netbox
        - runn_psqlaissa
      become: true
      ansible.builtin.file:
        src: "/opt/netbox-{{ netbox_version }}"
        dest: /opt/netbox
        state: link
        force: true


    - name: Create system group netbox
      group:
        name: netbox
        system: yes
      tags: runn_psqlaissa

    - name: Create user system group netbox  
      user:
        name: netbox
        system: yes
        group: netbox
      tags: runn_psqlaissa

    - name: giving the right permissions for /opt/netbox/netbox/media/
      file:
        path: /opt/netbox/netbox/media/
        owner: netbox
        recurse: yes
      tags: runn_psqlaissa

    - name: giving the right permissions for  /opt/netbox/netbox/reports/
      file: 
        path: /opt/netbox/netbox/reports/
        owner: netbox
        recurse: yes
      tags: runn_psqlaissa

    - name: giving the right permissions /opt/netbox/netbox/scripts/
      file:
        path: /opt/netbox/netbox/scripts/
        owner: netbox
        recurse: yes
      tags: runn_psqlaissa


    - name: Generate Secret key
      tags:
        - configure_netbox
        - runn_psqlaissa
        - create_netbox_database
      become: true
      ansible.builtin.command:
        python3 /opt/netbox/netbox/generate_secret_key.py
      register: secret_key
    - name: Get Netbox Secret key
      tags:
        - configure_netbox
        - runn_psqlaissa
        - create_netbox_database
      ansible.builtin.set_fact:
        netbox_secret_key: "{{ secret_key.stdout_lines[0] }}"
    - name: Copy configuration file
      tags:
        - copy_configuration_file
        - runn_psqlaissa
        - create_netbox_database
      become: true
      ansible.builtin.copy:
        src: /opt/netbox/netbox/netbox/configuration_example.py
        dest: /opt/netbox/netbox/netbox/configuration.py
        remote_src: true

    - name: Copy configuration.py template
      tags:
        - runn_psqlaissa
        - create_netbox_database
      become: true
      ansible.builtin.template:
        src: custom_settings.j2
        dest: "/opt/netbox/netbox/netbox/configuration.py"

    - name: Run NetBox upgrade script with Python 3.8
      tags:
        - runn_psqlaissa
      ansible.builtin.shell:
        cmd: sudo PYTHON=/usr/bin/python3.8 ./upgrade.sh
        chdir: /opt/netbox/
      become: yes

    - name: Créer Django Super 1user pour Netbox
      tags:
        - create_super_user
        - runn_psqlaissa123
        - create_netbox_database2
      become: true
      ansible.builtin.shell: |
        source /opt/netbox/venv/bin/activate && \
        cd /opt/netbox/netbox && \
        DJANGO_SUPERUSER_PASSWORD={{ django_superuser_password }} \
        python3 manage.py createsuperuser --username {{ django_superuser_name }} --email {{ django_superuser_email }} --noinput



    - name: Install NGINX
      command: yum -y install nginx 
      tags: aissa_moc


    - name: Copy gunicorn configuration file
      tags:
        - copy_gunicorn_configuration
        - run_upgrade_script111
        - create_netbox_database23
      become: true
      ansible.builtin.copy:
        src: /opt/netbox/contrib/gunicorn.py
        dest: /opt/netbox/gunicorn.py
        remote_src: true
        mode: '0644'


    - name: Find Netbox and Gunicorn service files
      tags:
        - setup_systemd
        - run_upgrade_script111
        - create_netbox_database23
      become: true
      ansible.builtin.find:
        path: /opt/netbox/contrib
        patterns:
          - "*.service"
      register: netbox_service_files


    - name: Setup systemd for Netbox
      tags:
        - setup_systemd
        - run_upgrade_script111
        - create_netbox_database23
      become: true
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: /etc/systemd/system
        remote_src: true
      loop: "{{ netbox_service_files.files }}"

    - name: Start NetBox and NetBox RQ services
      tags:
        - start_netbox_service
        - create_netbox_database23
        - - run_upgrade_script1112
      become: true
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      with_items: 
        - netbox
        - netbox-rq


    - name: Create SSL private directory
      file:
        path: /etc/ssl/private
        state: directory
      tags: create_openssl_certificate
    - name: Generate private key
      tags:
        - setup_http_server
        - create_openssl_certificate
        - create_openssl_privatekey
      become: true
      community.crypto.openssl_privatekey:
        path: /etc/ssl/private/netbox.key
        type: RSA
        size: 2048


    - name: Generate certificate signing request (CSR)
      tags:
        - setup_http_server
        - create_openssl_certificate
        - create_openssl_signing_certificate
      become: true
      community.crypto.openssl_csr:
        path: /etc/ssl/certs/netbox.csr
        privatekey_path: /etc/ssl/private/netbox.key


    - name: Create Openssl Certificate
      tags:
        - create_openssl_certificate
        - setup_http_server1
      become: true
      community.crypto.x509_certificate:
        privatekey_path: /etc/ssl/private/netbox.key
        path: /etc/ssl/certs/netbox.crt
        provider: selfsigned
        state: present
        csr_path: /etc/ssl/certs/netbox.csr
    - name: Copy netbox.conf.j2 template
      tags: 
        - runn_psqlaissaoo
        - create_netbox_database
      become: true
      ansible.builtin.template:
        src:  netbox.conf.j2
        dest: "/etc/nginx/conf.d/netbox.conf"

    - name: copy nginx.conf.j2 template
      tags:
        - runn_psqlaissaoo
        - create_netbox_database
      become: true
      ansible.builtin.template:
        src:   nginx.conf.j2
        dest: "/etc/nginx/nginx.conf" 

    - name: run setsebool command 
      command: sudo setsebool -P httpd_can_network_connect 1
      tags: aissa_moc22


    - name: restart all services 
      command: sudo systemctl restart netbox netbox-rq nginx postgresql-13
      tags: resatrt_all

