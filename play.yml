      tags:
        - downloads_link
        - install_pgpool


    - name: extract link
      command: sudo tar xf download.php?f=pgpool-II-4.4.5.tar.gz
      tags:
        - extract_link

    - name: Update the memory cache
      tags:
        - install_redis
        - create_netbox_database
